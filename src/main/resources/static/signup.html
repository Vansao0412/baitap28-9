<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Demo - Đăng ký</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container narrow">
    <section class="card">
        <span class="eyebrow">SIGNUP</span>
        <h1>Tạo tài khoản</h1>
        <p class="muted">Tài khoản được lưu trong MySQL. Sau đó đăng nhập để nhận JWT.</p>
        <form id="signup-form">
            <label>Họ tên<input name="fullName" maxlength="50" required></label>
            <label>Email<input name="email" type="email" autocomplete="username" required></label>
            <label>Mật khẩu<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
            <button class="button" type="submit">Đăng ký</button>
        </form>
        <p id="message" class="message"></p>
        <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
        <a href="/index.html">← Trang chủ</a>
    </section>
</main>
<script src="/js/app.js"></script>
<script>
document.querySelector('#signup-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    const message = document.querySelector('#message');
    message.classList.remove('error');
    try {
        const response = await api('/auth/signup', {
            method: 'POST',
            body: JSON.stringify({
                fullName: form.get('fullName'),
                email: form.get('email'),
                password: form.get('password')
            })
        });
        if (!response.ok) throw new Error((await response.json()).message || 'Đăng ký thất bại');
        message.textContent = 'Đăng ký thành công. Đang chuyển đến trang đăng nhập...';
        window.setTimeout(() => window.location.href = '/login', 500);
    } catch (error) {
        message.classList.add('error');
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
