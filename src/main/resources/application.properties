spring.application.name=JWT_springboot3
server.port=${PORT:8005}

spring.datasource.url=${JWT_DEMO_DB_URL:jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${JWT_DEMO_DB_USER:root}
spring.datasource.password=${JWT_DEMO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

security.jwt.secret-key=${JWT_SECRET:}
security.jwt.expiration-time=${JWT_EXPIRATION:3600000}

spring.jackson.default-property-inclusion=non_null
